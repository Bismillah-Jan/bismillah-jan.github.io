<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">BJ.</a>
    <nav class="site-nav">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <div class="site-header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
      <a class="button button-sm" href="mailto:bismillahjan222@gmail.com">Get in touch</a>
    </div>
  </div>
</header>
